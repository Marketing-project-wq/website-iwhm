<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontak — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Hubungi tim Indonesia Women Half Marathon 2026.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Langsung ke konten utama</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Kontak</span>
        <h1>Hubungi Kami</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <dl class="fact-list about-facts" data-contact-list style="max-width: var(--container-narrow);"></dl>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal">
      <button class="modal__close" data-modal-close aria-label="Tutup">&times;</button>
      <h3 id="register-modal-title">Pendaftaran belum dibuka</h3>
      <p>Pendaftaran dibuka <span data-bind="REGISTRATION_OPEN_LABEL"></span>. Pantau halaman ini atau ikuti media sosial resmi IWHM untuk info terbaru.</p>
    </div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var list = document.querySelector('[data-contact-list]');
      if (!D || !list) return;
      var labels = {
        email: { id: 'Email', en: 'Email' },
        whatsapp: { id: 'WhatsApp', en: 'WhatsApp' },
        instagram: { id: 'Instagram', en: 'Instagram' },
        tiktok: { id: 'TikTok', en: 'TikTok' }
      };
      Object.keys(labels).forEach(function (key) {
        var value = D.CONTACT[key];
        var div = document.createElement('div');
        div.innerHTML =
          '<dt>' + labels[key][D.LANG] + '</dt>' +
          '<dd>' + (value ? value : '<span class="badge badge--tbc">Menunggu konfirmasi</span>') + '</dd>';
        list.appendChild(div);
      });
    });
  </script>
</body>
</html>
