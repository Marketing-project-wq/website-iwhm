<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mitra — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Mitra dan sponsor Indonesia Women Half Marathon 2026 — akan diumumkan menjelang race day.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">
  <!-- SEO: canonical + hreflang (statis; generated by scripts/generate-seo-tags.js) -->
  <link rel="canonical" href="https://website-iwhm-production.up.railway.app/id/partners.html">
  <link rel="alternate" hreflang="en" href="https://website-iwhm-production.up.railway.app/en/partners.html">
  <link rel="alternate" hreflang="id" href="https://website-iwhm-production.up.railway.app/id/partners.html">
  <link rel="alternate" hreflang="x-default" href="https://website-iwhm-production.up.railway.app/en/partners.html">
  <!-- /SEO -->

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Langsung ke konten utama</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Mitra</span>
        <h1>Mitra &amp; Sponsor</h1>
        <p>Struktur mitra IWHM 2026 akan terisi begitu kemitraan resmi dikonfirmasi.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: var(--container-narrow);">
        <div data-partner-tiers></div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container prose">
        <div class="section__heading">
          <h2>Kekuatan Komunitas</h2>
        </div>
        <p>IWHM digerakkan bersama <span data-bind="EVENT.communities"></span> komunitas lari mitra, dengan jangkauan komunitas <span data-bind="EVENT.networkReach"></span>.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var wrap = document.querySelector('[data-partner-tiers]');
      if (!D || !wrap) return;
      D.PARTNER_TIERS.forEach(function (tier) {
        var partnersInTier = D.PARTNERS.filter(function (p) { return p.tier === tier.key; });
        var block = document.createElement('div');
        block.className = 'tier-block';
        block.innerHTML =
          '<p class="tier-block__label">' + tier.label[D.LANG] + '</p>' +
          (partnersInTier.length
            ? '' /* logo mitra dirender di sini kalau PARTNERS terisi */
            : '<p style="margin-top:.5em;"><span class="badge badge--tbc">Menunggu konfirmasi</span></p>');
        wrap.appendChild(block);
      });
    });
  </script>
</body>
</html>
