<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peraturan &amp; Ketentuan — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Peraturan dan ketentuan resmi Indonesia Women Half Marathon 2026 — segera hadir.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Langsung ke konten utama</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Lomba</span>
        <h1>Peraturan &amp; Ketentuan</h1>
        <p>Naskah resmi peraturan dan ketentuan IWHM 2026 sedang disiapkan. Kerangka babnya sudah kami susun di bawah ini.</p>
      </div>
    </section>

    <!-- Deck sumber TIDAK memuat satupun naskah peraturan. Jangan isi badan teks — hanya kerangka bab + badge. -->
    <section class="section">
      <div class="container">
        <div style="max-width: var(--container-narrow); display: grid; gap: var(--space-s);" data-rules-sections></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var wrap = document.querySelector('[data-rules-sections]');
      if (!D || !wrap) return;
      D.RULES_SECTIONS.forEach(function (section) {
        var row = document.createElement('div');
        row.className = 'card';
        row.style.background = 'var(--paper-2)';
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.alignItems = 'center';
        row.style.flexWrap = 'wrap';
        row.style.gap = 'var(--space-s)';
        row.innerHTML =
          '<h2 style="font-size:var(--step-1);">' + section.title[D.LANG] + '</h2>' +
          '<span class="badge badge--tbc">Menunggu naskah resmi</span>';
        wrap.appendChild(row);
      });
    });
  </script>
</body>
</html>
