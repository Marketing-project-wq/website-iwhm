<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Rangkaian jadwal Indonesia Women Half Marathon 2026, dari Kick Off hingga Race Day 22 November 2026 di Plaza Parkir Timur, GBK Senayan.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Langsung ke konten utama</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Lomba</span>
        <h1>Jadwal Rangkaian IWHM 2026</h1>
        <p>Dari kick off hingga race day. Jadwal race weekend dapat berubah — pantau halaman ini untuk info terbaru.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <ul class="timeline-list" data-timeline style="max-width: var(--container-narrow);"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var list = document.querySelector('[data-timeline]');
      if (!D || !list) return;
      D.TIMELINE.forEach(function (item) {
        var dateHtml = item.date
          ? item.date[D.LANG] + (item.confirmed ? '' : ' <span class="badge badge--tbc">Menunggu konfirmasi</span>')
          : '<span class="badge badge--tbc">Menunggu konfirmasi</span>';
        var li = document.createElement('li');
        li.className = 'timeline-item';
        li.innerHTML =
          '<p class="timeline-item__date">' + dateHtml + '</p>' +
          '<h3 class="timeline-item__title">' + item.title[D.LANG] + '</h3>' +
          (item.place ? '<p class="timeline-item__place">' + item.place[D.LANG] + '</p>' : '');
        list.appendChild(li);
      });
    });
  </script>
</body>
</html>
