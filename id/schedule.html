<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Rangkaian jadwal Indonesia Women Half Marathon 2026, dari Kick Off hingga Race Day 22 November 2026 di Plaza Parkir Timur, GBK Senayan.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">
  <!-- SEO: canonical + hreflang (statis; generated by scripts/generate-seo-tags.js) -->
  <link rel="canonical" href="https://website-iwhm-production.up.railway.app/id/schedule.html">
  <link rel="alternate" hreflang="en" href="https://website-iwhm-production.up.railway.app/en/schedule.html">
  <link rel="alternate" hreflang="id" href="https://website-iwhm-production.up.railway.app/id/schedule.html">
  <link rel="alternate" hreflang="x-default" href="https://website-iwhm-production.up.railway.app/en/schedule.html">
  <!-- /SEO -->

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Langsung ke konten utama</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Lomba</span>
        <h1>Jadwal Rangkaian IWHM 2026</h1>
        <p>Dari kick off hingga race day. Jadwal race weekend dapat berubah — pantau halaman ini untuk info terbaru.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-heading">
          <h2>Race Weekend</h2>
        </div>
        <div class="weekend__grid" data-weekend-cards></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var grid = document.querySelector('[data-weekend-cards]');
      if (!D || !grid) return;
      D.WEEKEND.forEach(function (item) {
        var card = document.createElement('div');
        card.className = 'weekend-card';
        card.innerHTML =
          '<h3 class="weekend-card__title">' + item.title[D.LANG] + '</h3>' +
          '<p class="weekend-card__when">' + item.when[D.LANG] +
            (item.confirmed ? '' : ' <span class="badge badge--tbc">Menunggu konfirmasi</span>') + '</p>' +
          '<p class="weekend-card__where">' + item.where[D.LANG] + '</p>';
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
