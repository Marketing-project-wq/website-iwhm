<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="The full IWHM 2026 schedule, from Kick Off to Race Day on 22 November 2026 at Plaza Parkir Timur, GBK Senayan.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Race</span>
        <h1>IWHM 2026 Schedule</h1>
        <p>From kick off to race day. The race weekend schedule may change — check this page for updates.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-heading">
          <h2>Race Weekend</h2>
        </div>
        <div class="weekend__grid" data-weekend-cards></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var grid = document.querySelector('[data-weekend-cards]');
      if (!D || !grid) return;
      D.WEEKEND.forEach(function (item) {
        var card = document.createElement('div');
        card.className = 'weekend-card';
        card.innerHTML =
          '<h3 class="weekend-card__title">' + item.title[D.LANG] + '</h3>' +
          '<p class="weekend-card__when">' + item.when[D.LANG] +
            (item.confirmed ? '' : ' <span class="badge badge--tbc">Pending confirmation</span>') + '</p>' +
          '<p class="weekend-card__where">' + item.where[D.LANG] + '</p>';
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
