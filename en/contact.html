<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Get in touch with the Indonesia Women Half Marathon 2026 team.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Contact</span>
        <h1>Get in Touch</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <dl class="fact-list about-facts" data-contact-list style="max-width: var(--container-narrow);"></dl>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var list = document.querySelector('[data-contact-list]');
      if (!D || !list) return;
      var labels = {
        email: { id: 'Email', en: 'Email' },
        whatsapp: { id: 'WhatsApp', en: 'WhatsApp' },
        instagram: { id: 'Instagram', en: 'Instagram' },
        tiktok: { id: 'TikTok', en: 'TikTok' }
      };
      Object.keys(labels).forEach(function (key) {
        var value = D.CONTACT[key];
        var div = document.createElement('div');
        div.innerHTML =
          '<dt>' + labels[key][D.LANG] + '</dt>' +
          '<dd>' + (value ? value : '<span class="badge badge--tbc">Pending confirmation</span>') + '</dd>';
        list.appendChild(div);
      });
    });
  </script>
</body>
</html>
