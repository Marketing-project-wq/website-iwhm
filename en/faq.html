<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Frequently asked questions about categories, schedule, and participation at Indonesia Women Half Marathon 2026.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">
  <!-- SEO: canonical + hreflang (statis; generated by scripts/generate-seo-tags.js) -->
  <link rel="canonical" href="https://website-iwhm-production.up.railway.app/en/faq.html">
  <link rel="alternate" hreflang="en" href="https://website-iwhm-production.up.railway.app/en/faq.html">
  <link rel="alternate" hreflang="id" href="https://website-iwhm-production.up.railway.app/id/faq.html">
  <link rel="alternate" hreflang="x-default" href="https://website-iwhm-production.up.railway.app/en/faq.html">
  <!-- /SEO -->

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Info</span>
        <h1>Frequently Asked Questions</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="accordion" data-faq-list style="max-width: var(--container-narrow);"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var list = document.querySelector('[data-faq-list]');
      if (!D || !list) return;

      D.FAQ.forEach(function (item, i) {
        var itemEl = document.createElement('div');
        itemEl.className = 'accordion-item';
        itemEl.setAttribute('data-open', i === 0 ? 'true' : 'false');
        var triggerId = 'faq-trigger-' + item.key;
        var panelId = 'faq-panel-' + item.key;
        itemEl.innerHTML =
          '<button class="accordion-item__trigger" id="' + triggerId + '" aria-expanded="' + (i === 0 ? 'true' : 'false') + '" aria-controls="' + panelId + '">' +
            '<span>' + item.q[D.LANG] + '</span>' +
            '<span class="accordion-item__icon" aria-hidden="true">+</span>' +
          '</button>' +
          '<div class="accordion-item__panel" id="' + panelId + '" role="region" aria-labelledby="' + triggerId + '"><p>' + item.a[D.LANG] + '</p></div>';
        list.appendChild(itemEl);

        itemEl.querySelector('.accordion-item__trigger').addEventListener('click', function () {
          var open = itemEl.getAttribute('data-open') === 'true';
          itemEl.setAttribute('data-open', open ? 'false' : 'true');
          this.setAttribute('aria-expanded', open ? 'false' : 'true');
        });
      });
    });
  </script>
</body>
</html>
