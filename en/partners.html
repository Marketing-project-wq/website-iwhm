<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partners — Indonesia Women Half Marathon 2026</title>
  <meta name="description" content="Partners and sponsors of Indonesia Women Half Marathon 2026 — to be announced closer to race day.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo/logo-mark.svg">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header" data-include="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Partners</span>
        <h1>Partners &amp; Sponsors</h1>
        <p>IWHM 2026's partner lineup will be filled in as official partnerships are confirmed.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: var(--container-narrow);">
        <div data-partner-tiers></div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container prose">
        <div class="section__heading">
          <h2>Community Network</h2>
        </div>
        <p>IWHM is powered together with <span data-bind="EVENT.communities"></span> partner running communities, reaching a network of <span data-bind="EVENT.networkReach"></span>.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="footer"></footer>

  <div id="register-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
    <div class="modal" data-include="modal-register"></div>
  </div>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var D = window.D;
      var wrap = document.querySelector('[data-partner-tiers]');
      if (!D || !wrap) return;
      D.PARTNER_TIERS.forEach(function (tier) {
        var partnersInTier = D.PARTNERS.filter(function (p) { return p.tier === tier.key; });
        var block = document.createElement('div');
        block.className = 'tier-block';
        block.innerHTML =
          '<p class="tier-block__label">' + tier.label[D.LANG] + '</p>' +
          (partnersInTier.length
            ? ''
            : '<p style="margin-top:.5em;"><span class="badge badge--tbc">Pending confirmation</span></p>');
        wrap.appendChild(block);
      });
    });
  </script>
</body>
</html>
